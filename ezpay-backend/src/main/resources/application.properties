spring.application.name=ezpay-backend

server.port=8083
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=system
spring.datasource.password=tiger
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# APPLICATION LOGGING
# ==========================================

logging.level.root=INFO

# EZPAY application packages
logging.level.com.EZPAY=DEBUG
logging.level.controller=DEBUG
logging.level.Service=DEBUG
logging.level.repository=DEBUG
logging.level.entity=DEBUG
logging.level.dto=DEBUG
logging.level.enums=DEBUG
logging.level.exception=DEBUG

# ==========================================
# HIBERNATE / SQL LOGGING
# ==========================================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# SPRING WEB LOGGING
# ==========================================

logging.level.org.springframework.web=INFO